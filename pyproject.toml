[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentML"
version = "0.1.0"
description = """AgentML is a rendering convention — any HTTP resource adds /agents 
                and gets a fully rendered agent-page: complete world-state, context, 
                permissions, current state, available actions, guidance, 
                navigation — everything a webpage gives a human, but native to 
                how agents think. Universal. No protocol. Just HTTP."""
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
