[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentml"
version = "0.1.0"
description = "A rendering convention for AI agents — append /agents to any FastAPI route and get a fully structured agent workspace with state, capabilities, RBAC, and navigation."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Priyanshu"}
]
keywords = ["fastapi", "agents", "llm", "mcp", "ai", "agentic", "rest", "openai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/priyanshu7739410/AgentML"
Repository = "https://github.com/priyanshu7739410/AgentML"
"Bug Tracker" = "https://github.com/priyanshu7739410/AgentML/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentML*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
